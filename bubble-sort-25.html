<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>GPU Bubble Sort on Image (Odd-Even per row)</title>
	<style>
		html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji; }
		#ui { position: fixed; top: 8px; left: 8px; display: flex; gap: 8px; align-items: center; background: rgba(0,0,0,0.4); padding: 8px 10px; border-radius: 8px; }
		#ui .hint { cursor: help; opacity: 0.85; user-select: none; }
		#drop-overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); background: rgba(0,0,0,0.35); color: #fff; font-size: 20px; letter-spacing: 0.3px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); z-index: 10; }
		#drop-overlay .panel { border: 2px dashed rgba(255,255,255,0.6); padding: 16px 20px; border-radius: 10px; background: rgba(0,0,0,0.25); }
		label { opacity: 0.9; }
		canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
	</style>
</head>
<body>
	<div id="ui">
		<label>Speed <input id="speed" type="range" min="1" max="256" step="1" value="10"></label>
		<label>Mode
			<select id="mode">
				<option value="lumHoriz">lumHoriz</option>
				<option value="hueLumVert" selected>hueLumVert</option>
			</select>
		</label>
		<button id="reset">Reset</button>
		<span id="status"></span>
		<span class="hint" title="Drop a file here to sort">🛈</span>
	</div>
	<div id="drop-overlay"><div class="panel">Drop an image anywhere to sort</div></div>
	<script type="module">
		import * as THREE from './public/three/build/three.module.js';

		// NOTE: This implements a GPU odd-even (brick) sort pass per frame across image rows
		// using ping-pong framebuffers. It's compute-like and runs entirely on the GPU.
		// Each pass compares adjacent pairs (i, i+1) for either odd or even i based on phase.
		// Over many passes it approximates a bubble sort of each row by luminance.

		const IMAGE_URL = './res/360_F_202297164_NSSIqkr7QKi5Ltjrizwh9XGzH0MNANRN.jpg';

		const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
		renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
		document.body.appendChild(renderer.domElement);

		const scene = new THREE.Scene();
		const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

		const quadGeom = new THREE.PlaneGeometry(2, 2);

		// Fullscreen blit material
		const blitMat = new THREE.ShaderMaterial({
			uniforms: { tInput: { value: null } },
			vertexShader: /* glsl */`
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = vec4(position.xy, 0.0, 1.0);
				}
			`,
			fragmentShader: /* glsl */`
				precision highp float;
				uniform sampler2D tInput;
				varying vec2 vUv;
				void main() {
					gl_FragColor = texture2D(tInput, vUv);
				}
			`,
			depthTest: false,
			depthWrite: false
		});

		// Odd-even row sort pass material (horizontal, luminance)
		const sortMatLumHoriz = new THREE.ShaderMaterial({
			uniforms: {
				tInput: { value: null },
				resolution: { value: new THREE.Vector2(1,1) },
				phase: { value: 0 }, // 0 -> even, 1 -> odd
				direction: { value: 0 }, // 0 -> ASC, 1 -> DESC
			},
			vertexShader: /* glsl */`
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = vec4(position.xy, 0.0, 1.0);
				}
			`,
			fragmentShader: /* glsl */`
				precision highp float;
				uniform sampler2D tInput;
				uniform vec2 resolution;
				uniform int phase; // 0 even, 1 odd
				uniform int direction; // 0 asc, 1 desc
				varying vec2 vUv;

				float luminance(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

				void main() {
					vec2 size = resolution;
					vec2 texel = 1.0 / size;

					vec2 pxy = vUv * size - 0.5;
					ivec2 ip = ivec2(floor(pxy + 0.5));
					ip = clamp(ip, ivec2(0), ivec2(int(size.x)-1, int(size.y)-1));

					int start = phase; // even: 0, odd: 1
					bool isLeft = (ip.x % 2) == start;
					bool isRight = (ip.x % 2) == 1-start;

					vec4 A = texture2D(tInput, (vec2(ip) + 0.5) * texel);
					vec4 outColor = A;

					if (isLeft && ip.x + 1 < int(size.x)) {
						vec4 B = texture2D(tInput, (vec2(ip.x + 1, ip.y) + 0.5) * texel);
						float La = luminance(A.rgb);
						float Lb = luminance(B.rgb);
						bool swap = (direction == 0) ? (La > Lb) : (La < Lb);
						outColor = swap ? B : A;
					} else if (isRight && ip.x - 1 >= 0) {
						vec4 L = texture2D(tInput, (vec2(ip.x - 1, ip.y) + 0.5) * texel);
						float Ll = luminance(L.rgb);
						float La2 = luminance(A.rgb);
						bool swap2 = (direction == 0) ? (Ll > La2) : (Ll < La2);
						outColor = swap2 ? L : A;
					}

					gl_FragColor = outColor;
				}
			`,
			depthTest: false,
			depthWrite: false
		});

		// Odd-even column sort pass material (vertical, hue with luminance tiebreaker)
		const sortMatHueVert = new THREE.ShaderMaterial({
			uniforms: {
				tInput: { value: null },
				resolution: { value: new THREE.Vector2(1,1) },
				phase: { value: 0 }, // 0 -> even rows as tops, 1 -> odd rows as tops
				direction: { value: 0 }, // 0 -> ASC, 1 -> DESC
			},
			vertexShader: /* glsl */`
				varying vec2 vUv;
				void main() {
					vUv = uv;
					gl_Position = vec4(position.xy, 0.0, 1.0);
				}
			`,
			fragmentShader: /* glsl */`
				precision highp float;
				uniform sampler2D tInput;
				uniform vec2 resolution;
				uniform int phase; // 0 even, 1 odd (along y)
				uniform int direction; // 0 asc, 1 desc
				varying vec2 vUv;

				float luminance(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }

				// Return hue in [0,1]
				float hueOf(vec3 c) {
					float maxc = max(max(c.r, c.g), c.b);
					float minc = min(min(c.r, c.g), c.b);
					float delta = maxc - minc;
					if (delta < 1e-6) return 0.0;
					float h;
					if (maxc == c.r)      h = (c.g - c.b) / delta + (c.g < c.b ? 6.0 : 0.0);
					else if (maxc == c.g) h = (c.b - c.r) / delta + 2.0;
					else                  h = (c.r - c.g) / delta + 4.0;
					return fract(h / 6.0);
				}

				void main() {
					vec2 size = resolution;
					vec2 texel = 1.0 / size;

					vec2 pxy = vUv * size - 0.5;
					ivec2 ip = ivec2(floor(pxy + 0.5));
					ip = clamp(ip, ivec2(0), ivec2(int(size.x)-1, int(size.y)-1));

					int start = phase; // even: 0, odd: 1
					bool isTop = (ip.y % 2) == start;
					bool isBottom = (ip.y % 2) == 1-start;

					vec4 A = texture2D(tInput, (vec2(ip) + 0.5) * texel);
					vec4 outColor = A;

					if (isTop && ip.y + 1 < int(size.y)) {
						vec4 B = texture2D(tInput, (vec2(ip.x, ip.y + 1) + 0.5) * texel);
						float Ha = hueOf(A.rgb);
						float Hb = hueOf(B.rgb);
						bool swap = (direction == 0) ? (Ha > Hb) : (Ha < Hb);
						if (abs(Ha - Hb) < 1e-3) {
							float La = luminance(A.rgb);
							float Lb = luminance(B.rgb);
							swap = (direction == 0) ? (La > Lb) : (La < Lb);
						}
						outColor = swap ? B : A;
					} else if (isBottom && ip.y - 1 >= 0) {
						vec4 T = texture2D(tInput, (vec2(ip.x, ip.y - 1) + 0.5) * texel);
						float Ht = hueOf(T.rgb);
						float Ha2 = hueOf(A.rgb);
						bool swap2 = (direction == 0) ? (Ht > Ha2) : (Ht < Ha2);
						if (abs(Ht - Ha2) < 1e-3) {
							float Lt = luminance(T.rgb);
							float La2 = luminance(A.rgb);
							swap2 = (direction == 0) ? (Lt > La2) : (Lt < La2);
						}
						outColor = swap2 ? T : A;
					}

					gl_FragColor = outColor;
				}
			`,
			depthTest: false,
			depthWrite: false
		});

		const quad = new THREE.Mesh(quadGeom, blitMat);
		scene.add(quad);

		let rtA, rtB, viewRT; // ping-pong render targets
		const loader = new THREE.TextureLoader();
		const statusEl = document.getElementById('status');
		const speedEl = document.getElementById('speed');
		const resetBtn = document.getElementById('reset');
		const modeEl = document.getElementById('mode');

		let phase = 0; // legacy, unused in new logic
		let phaseH = 0; // phase for horizontal passes
		let phaseV = 0; // phase for vertical passes
		let passes = 0;
		let imgW = 0, imgH = 0;
		let mode = 'lumHoriz';

		function makeTarget(w, h) {
			return new THREE.WebGLRenderTarget(w, h, {
				minFilter: THREE.NearestFilter,
				magFilter: THREE.NearestFilter,
				format: THREE.RGBAFormat,
				type: THREE.UnsignedByteType,
				depthBuffer: false,
				stencilBuffer: false
			});
		}

		function resizeRendererToImage(w, h) {
			renderer.setSize(w, h, false);
		}

		function initFromTexture(tex) {
			tex.minFilter = THREE.NearestFilter;
			tex.magFilter = THREE.NearestFilter;
			tex.flipY = false;

			imgW = tex.image.width;
			imgH = tex.image.height;

			if (rtA) { rtA.dispose(); rtB.dispose(); }
			rtA = makeTarget(imgW, imgH);
			rtB = makeTarget(imgW, imgH);
			viewRT = rtA;

			// Blit original image into rtA
			blitMat.uniforms.tInput.value = tex;
			renderer.setRenderTarget(rtA);
			renderer.render(scene, camera);
			renderer.setRenderTarget(null);

			quad.material = blitMat;
			blitMat.uniforms.tInput.value = rtA.texture;
			resizeRendererToImage(imgW, imgH);

			sortMatLumHoriz.uniforms.resolution.value.set(imgW, imgH);
			sortMatHueVert.uniforms.resolution.value.set(imgW, imgH);
			passes = 0;
			phase = 0;
			phaseH = 0;
			phaseV = 0;
			// updateStatus();
		}

		function doPass(material, phaseValue) {
			if (!viewRT) return false;
			material.uniforms.tInput.value = viewRT.texture;
			material.uniforms.phase.value = phaseValue | 0;

			quad.material = material;
			renderer.setRenderTarget(viewRT === rtA ? rtB : rtA);
			renderer.render(scene, camera);
			renderer.setRenderTarget(null);

			viewRT = (viewRT === rtA) ? rtB : rtA;
			quad.material = blitMat;
			blitMat.uniforms.tInput.value = viewRT.texture;
			passes++;
			// updateStatus();
			return true;
		}

		function sortPass() {
			if (!viewRT) return;
			if (mode === 'lumHoriz') {
				doPass(sortMatLumHoriz, phaseH);
				phaseH = 1 - phaseH;
			} else if (mode === 'hueLumVert') {
				// Vertical hue pass
				doPass(sortMatHueVert, phaseV);
				phaseV = 1 - phaseV;
				// Horizontal luminance pass
				doPass(sortMatLumHoriz, phaseH);
				phaseH = 1 - phaseH;
			}
		}

		let raf;
		function animate() {
			renderer.setAnimationLoop(() => {
				const steps = parseInt(speedEl.value, 10) | 0;
				for (let i = 0; i < steps; i++) sortPass();
				renderer.render(scene, camera);
			});
		}

		resetBtn.addEventListener('click', () => {
			loader.load(IMAGE_URL, initFromTexture);
		});

		modeEl.addEventListener('change', () => {
			mode = modeEl.value;
			phaseH = 0;
			phaseV = 0;
		});
		mode = modeEl.value;

		const overlay = document.getElementById('drop-overlay');

		async function initFromBlob(blob) {
			try {
				const bitmap = await createImageBitmap(blob, { colorSpaceConversion: 'default', premultiplyAlpha: 'default', imageOrientation: 'from-image' });
				const tex = new THREE.Texture(bitmap);
				tex.needsUpdate = true;
				initFromTexture(tex);
			} catch (err) {
				console.error('Failed to load dropped image', err);
			}
		}

		function showOverlay() { overlay.style.display = 'flex'; }
		function hideOverlay() { overlay.style.display = 'none'; }

		window.addEventListener('dragover', (e) => { e.preventDefault(); showOverlay(); });
		window.addEventListener('dragenter', (e) => { e.preventDefault(); showOverlay(); });
		window.addEventListener('dragleave', (e) => {
			// Hide when leaving document
			if (!e.relatedTarget || (e.relatedTarget === document || e.relatedTarget === document.documentElement)) hideOverlay();
		});
		window.addEventListener('drop', (e) => {
			e.preventDefault();
			hideOverlay();
			const files = e.dataTransfer?.files;
			if (!files || files.length === 0) return;
			const file = files[0];
			if (file && file.type && file.type.startsWith('image/')) {
				initFromBlob(file);
			}
		});

		loader.load(IMAGE_URL, initFromTexture);
		animate();
	</script>
</body>
</html>
